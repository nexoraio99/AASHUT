<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="1280" height="960" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Saturn mark. The electric effect traces the edges of the opaque shapes,
       so the gaps between planet, ring and ring division are left transparent. -->
  <defs>
    <clipPath id="front"><rect x="0" y="240" width="640" height="240"/></clipPath>
    <clipPath id="back"><rect x="0" y="0" width="640" height="240"/></clipPath>
    <!-- planet with the front arc of the ring cut out of it -->
    <mask id="planetMask" maskUnits="userSpaceOnUse" x="0" y="0" width="640" height="480">
      <rect width="640" height="480" fill="#fff"/>
      <g clip-path="url(#front)">
        <ellipse cx="320" cy="240" rx="246" ry="60" fill="none" stroke="#000" stroke-width="64"/>
      </g>
    </mask>
    <!-- ring with the part hidden behind the planet cut out of it -->
    <mask id="ringMask" maskUnits="userSpaceOnUse" x="0" y="0" width="640" height="480">
      <rect width="640" height="480" fill="#fff"/>
      <g clip-path="url(#back)">
        <circle cx="320" cy="240" r="142" fill="#000"/>
      </g>
    </mask>
  </defs>
  <g transform="rotate(-20 320 240)">
    <circle cx="320" cy="240" r="130" fill="#fff" mask="url(#planetMask)"/>
    <g mask="url(#ringMask)" fill="none" stroke="#fff">
      <!-- outer ring, division, inner ring -->
      <ellipse cx="320" cy="240" rx="264" ry="70" stroke-width="14"/>
      <ellipse cx="320" cy="240" rx="232" ry="54" stroke-width="26"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
